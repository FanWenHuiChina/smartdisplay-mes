services:
  postgres:
    image: postgres:16-alpine
    container_name: smartdisplay-mes-postgres
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: smartdisplay_mes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mes123456
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mes-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./smartdisplay-mes-api
      dockerfile: Dockerfile
    container_name: smartdisplay-mes-api
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartdisplay_mes
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mes123456
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    networks:
      - mes-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./smartdisplay-mes-ui
      dockerfile: Dockerfile
    container_name: smartdisplay-mes-ui
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8888:80"
    networks:
      - mes-network

volumes:
  postgres_data:
    driver: local

networks:
  mes-network:
    driver: bridge
