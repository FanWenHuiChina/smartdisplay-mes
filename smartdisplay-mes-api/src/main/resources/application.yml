spring:
  application:
    name: smartdisplay-mes-api

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/smartdisplay_mes}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:mes123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # Jackson配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.visionox.mes.*.entity

# SpringDoc配置 (Swagger UI)
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

# SmartDisplay MES试点配置
mes:
  pilot:
    # 生产默认不静默返回试点样例数据；演示环境如需降级需显式置为 true
    fallback-enabled: false
  security:
    jwt:
      # JWT 签名密钥，生产环境必须通过环境变量 MES_JWT_SECRET 注入独立密钥
      secret: ${MES_JWT_SECRET:smartdisplay-mes-jwt-secret-key-2024-very-long-key-for-hs256}
      # Token 有效期（毫秒），默认 24 小时
      expiration-ms: ${MES_JWT_EXPIRATION_MS:86400000}

# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 日志级别、格式与滚动策略由 logback-spring.xml 按 profile 统一管理（含 requestId MDC 关联）


# Actuator 监控端点（生产健康检查与度量）
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: SmartDisplay MES API
    description: 显示行业 MES + AI 试点系统
    version: 1.0.0-SNAPSHOT
